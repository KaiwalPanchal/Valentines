<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case #0214: The Stolen Heart</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Permanent+Marker&family=Special+Elite&family=Cutive+Mono&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Concentric Hearts Background -->
    <!-- Concentric Hearts Background REMOVED -->

    <div class="desk-container">

        <div class="folder-3d-container" id="folder">

            <!-- The Cover (Rotates) -->
            <div class="folder-cover">
                <!-- Front Face (Closed State) -->
                <div class="cover-face front">
                    <div class="folder-title-label">
                        <span>CASE #0214</span>
                    </div>
                    <div class="folder-instruction">
                        (Click to Open)
                    </div>
                    <div class="sticker-confidential"></div>
                </div>

                <!-- Back Face (Open State - Inner Left) -->
                <div class="cover-face back">
                    <div class="inner-pocket-left">
                        <div class="sticky-note-small">
                            <p class="handwritten">For your eyes only!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- The Back Panel (Stationary Base) -->
            <div class="folder-back-panel">
                <!-- empty; pages are now at container level -->
            </div>

            <!-- Document stack at container level so z-index isn't trapped -->
            <div class="document-stack" id="stack">
                <!-- Pages generated dynamically by script.js -->
            </div>

            <!-- Center spine crease -->
            <div class="folder-spine"></div>

        </div> <!-- End folder-3d-container -->

    </div> <!-- End desk-container -->

    <!-- ===================== VINYL PLAYER - DISABLED ===================== -->
    <!--
    <div class="vinyl-player" id="vinylPlayer">
        <img src="assets/textures/vinyl player.png" class="vinyl-player-img" alt="Vinyl Player" draggable="false">
        <div class="vinyl-spindle" id="vinylSpindle">
        </div>
    </div>
    -->

    <!-- Draggable Records (generated from songs.js config) - DISABLED -->
    <!--
    <div class="records-tray" id="recordsTray">
    </div>
    -->

    <!-- Hidden YouTube Player -->
    <div id="ytPlayerContainer" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;">
        <div id="ytPlayer"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="songs.js"></script>
    <script src="script.js"></script>
</body>

</html>
